# =============================================================================
# 발 전용 모델 v2: 발 속도 손실 추가 (feat/feet-to-body, docs/assumptions.md I12)
# -----------------------------------------------------------------------------
# - 사용: python foot_v2/train_foot_v2.py --run-name foot_v2
# - base 파일 (configs/foot_only.yaml) 의 값을 그대로 쓰고, 아래에 적은 값만 바꾼다
#   (foot_v2/train_foot_v2.py 가 합친다). 모델·학습 설정·데이터는 foot_only 와 완전히 같다.
# - 이유 [결정 I12]: foot_only 는 프레임마다 위치만 맞추도록 배워서 (L1 위치 + 접촉 BCE),
#   접촉 구간에서 발이 멈춰 있지 못한다 (위치로 판정한 접촉 recall 발끝 0.41, H10).
#   프레임 사이 변화량 (속도) 도 정답과 같게 하는 손실을 더한다 (논문 식 21 의 L_smooth 와 같은 생각).
# =============================================================================
base: foot_only.yaml

loss:
  w_vel: 1.0        # [결정 I12] L_vel = mean |Δp̂ − Δp| (cm/frame) 의 가중치. 조정해 보지 않은 값 (w_pos 와 같게 둠)
