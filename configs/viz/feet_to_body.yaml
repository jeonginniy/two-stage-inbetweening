# =============================================================================
# 발 → 몸 모델 영상 설정 (feat/feet-to-body)
# -----------------------------------------------------------------------------
# - 사용처: feet_to_body/render_body.py (load_named_config("viz", "feet_to_body"))
# - ctx_base, det_cont, long 평가셋은 configs/eval/lengths.yaml, 발 전용 모델은 configs/eval/foot_only.yaml 을 그대로 쓴다.
# - 값의 출처: [결정] = 이 영상에서 정한 값
# =============================================================================

# 대표 클립: long 평가셋의 "<BVH 이름>_<시작 프레임>" (발 전용 영상 configs/viz/foot_only.yaml 과 같은 클립) [결정]
clips: [walk3_subject5_5360, run1_subject5_4800, obstacles1_subject5_4040]
lengths: [30, 90]              # [결정] 학습 범위 끝 (30) 과 범위 밖 (90)

# 화면 2×2 의 네 칸 (왼쪽 위 → 오른쪽 위 → 왼쪽 아래 → 오른쪽 아래) [결정]
#   method: gt 또는 feet_to_body/evaluate.METHODS 의 이름. body_* 는 body_ckpt 가 필요하다.
panels:
  - {method: gt, label: "GT"}
  - {method: two_stage, label: "Two-stage"}
  - {method: body_pred_post, label: "feet->body, predicted feet", body_ckpt: experiments/feet_to_body_pred/best.pth}
  - {method: body_gt_post, label: "feet->body, GT feet (upper bound)", body_ckpt: experiments/feet_to_body/best.pth}

segment_colors:                # configs/viz/video.yaml 과 같은 구간 색
  context: "#1f77b4"
  generated: "#ff7f0e"
  target: "#d62728"
ghost_color: "#9e9e9e"         # 각 칸에 겹쳐 그리는 GT (얇은 회색)
given_feet_color: "#2ca02c"    # 발 → 몸 칸: 조건으로 준 발 4관절 (초록 점)
target_hold_frames: 15         # target 프레임을 멈춰서 보여줄 프레임 수
fps: 30
dpi: 100
figsize: [12.8, 7.2]
out_path: outputs/videos/feet_to_body/{clip}/trans{trans:03d}.mp4
