# =============================================================================
# 실행 환경 설정: 노트북 (Windows, CPU)
# -----------------------------------------------------------------------------
# - 사용처: src/config.py 의 load_env_config("laptop")
# - 선택 방법: 스크립트에 --env laptop 을 주거나, 환경변수 TSI_ENV=laptop
# - 데이터 경로와 장치(device)는 코드에 직접 쓰지 않고 오직 이 파일에서만 관리한다.
# - 상대경로는 "프로젝트 루트" 기준으로 해석된다.
# =============================================================================

paths:
  # LaFAN1 BVH 폴더 (*.bvh 77개가 바로 들어있는 폴더).
  # 노트북에는 LaFAN1 이 없어서 null. 생기면 예: C:/Users/aa010/datasets/lafan1
  lafan1_bvh_dir: null

  # 전처리 결과 캐시(파싱된 BVH .npz, 정규화 통계 .npz)를 저장할 폴더
  cache_dir: data/cache

  # (선택) 공식 코드 폴더. 검증 단계에서 공식 결과와 비교할 때만 쓴다.
  # 노트북에는 C:/Users/aa010/projects/motion_inbetweening 이 없었음.
  official_repo: null

  # 학습 결과(체크포인트, 로그) 폴더 (프로젝트 루트 기준, git 제외)
  experiments_dir: experiments

# 연산 장치: "cpu" 또는 "cuda:0" 등. cuda 를 적었는데 GPU 가 없으면 cpu 로 대체(경고).
device: cpu

# DataLoader 워커 수. Windows 에서는 0 이 안전하다.
num_workers: 0
