# =============================================================================
# 평가 설정: transition 길이별 평가 (4단계)
# -----------------------------------------------------------------------------
# - 사용처: src/config.py 의 load_named_config("eval", "lengths")
#           → src/evaluation/inference.py (평가셋 만들기), scripts/render_samples.py (영상 샘플 고르기),
#             scripts/eval_lengths.py (길이별 L2P/L2Q/NPSS/발 미끄러짐)
# - 값의 출처:
#     [논문 x.x]  = 논문에 명시된 값
#     [공식README] = 공식 저장소 README 에 적힌 값 (비교용 수치)
#     [공식코드]  = 논문에 없고 공식 코드에서 확인한 값 (= 가정, docs/assumptions.md F 절)
#     [결정]      = 이 프로젝트에서 정한 값
# =============================================================================

# 평가할 체크포인트 (학습 결과 폴더의 config.yaml 을 함께 읽는다)
ckpt: experiments/ctx_base/best.pth
# [결정] 3단계 Detail Transformer (방법 detail / detail_post). 학습 때 고정한 Context 가 위 ckpt 와 같아야 한다.
# 파일이 없으면 detail 방법은 건너뛴다 (--methods 로 직접 요청하면 에러).
detail_ckpt: experiments/det_base/best.pth

# 평가할 transition 길이 (프레임, 30fps). 30 = 1초, 300 = 10초
lengths: [5, 15, 30, 45, 60, 90, 150, 300]   # [논문 4.1 / 공식README] 5,15,30,45 + [결정] 60~300

# -----------------------------------------------------------------------------
# 평가셋 두 가지 (docs/assumptions.md F5)
# -----------------------------------------------------------------------------
eval_sets:
  # [논문 4.1] 공식 벤치마크: Subject 5, window 65, offset 40 → 2232 클립.
  # window 65 안에 context 10 + trans + target 다음 1프레임(후처리용)이 들어가야 해서
  # trans ≤ 53 까지만 계산한다 (공식 README 수치와 비교: 5, 15, 30, 45).
  official:
    split: benchmark          # configs/data/lafan1.yaml 의 splits 이름 그대로 사용
  # [결정] 긴 길이 평가셋: 모든 길이에서 "같은 시작 프레임" 의 클립을 쓴다.
  # window = context_len + max(lengths) + 2 (= 312) 로 잘라서, 길이가 바뀌면 target 만 뒤로 간다.
  long:
    actors: [subject5]
    window: auto              # auto = context_len + max(lengths) + 2
    offset: 40
    start_frame: 0

# 평가 배치 크기. GPU 메모리가 부족하면 자동으로 절반씩 줄여 다시 시도하고 실제 값을 기록한다.
batch_size: 64

# 결과 저장 위치 (프로젝트 루트 기준, git 제외). {run} = 체크포인트 폴더 이름 (예: ctx_base)
out_dir: outputs/eval/{run}

# -----------------------------------------------------------------------------
# 평가 지표 (docs/assumptions.md F1~F4)
# -----------------------------------------------------------------------------
# L2P 정규화 통계 μ, σ: 전역 관절 위치 (J×3) 의 차원별 평균/표준편차.
# [공식코드] Subject 1–4, window 50, offset 20 클립을 "평균 중심 정렬" (루트 XZ 평균 = 0, 마지막 context 프레임에서
# +X 를 보게) 한 뒤 계산. 결과는 data/cache/stats/ 에 캐시.
bench_stats:
  actors: [subject1, subject2, subject3, subject4]
  window: 50
  offset: 20
  start_frame: 0

# 비교할 방법 (eval_lengths.py --methods 로 덮어쓰기)
#   model        : Context Transformer + 후처리 (식 23)       ← 공식 README "w/ post-processing"
#   model_nopost : Context Transformer, 후처리 없음            ← 공식 README "WITHOUT post-processing"
#   interp       : 루트 선형보간 + 로컬 회전 SLERP 기준선        ← 공식 README inter_*
#   zerov        : zero-velocity (마지막 context 포즈 유지) 기준선 ← 공식 README zerov_*
#   detail       : 두 단계 (Context + 후처리 → Detail), Detail 출력 후처리 없음 ← 공식 README Detail (full)
#   detail_post  : 두 단계 + Detail 출력에도 후처리 (식 23)       (README 수치 없음)
methods: [model, model_nopost, detail, detail_post, interp, zerov]

# 발 미끄러짐 (선택, 논문에 없는 지표) [결정] F4
#   발가락 높이 h < H 인 프레임의 수평 속도 × (2 − 2^(h/H)) 를 transition 프레임·관절 평균 (cm/frame).
#   발목(Foot) 관절은 서 있을 때도 높이 7~8 cm 라서 쓰지 않는다 (발가락은 1~3 cm, Subject 5 실측).
foot_skating:
  joints: [LeftToe, RightToe]
  height_threshold_cm: 3.0

# [공식README] 공식 저장소 README 의 LaFAN1 벤치마크 수치 (비교용, 공식 벤치마크 2232 클립). L2P / L2Q / NPSS
readme_reference:
  model:          {5: [0.1288, 0.1143, 0.0015], 15: [0.4623, 0.3154, 0.0211], 30: [1.0354, 0.5898, 0.1210], 45: [1.9439, 0.9114, 0.3349]}
  model_nopost:   {5: [0.1717, 0.1325, 0.0015], 15: [0.4923, 0.3287, 0.0212], 30: [1.0663, 0.5991, 0.1238], 45: [1.9972, 0.9170, 0.3369]}
  interp:         {5: [0.3729, 0.22, 0.0023],   15: [1.2489, 0.62, 0.0391],   30: [2.3159, 0.98, 0.2013],   45: [3.4471, 1.25, 0.4493]}
  zerov:          {5: [1.5231, 0.56, 0.0053],   15: [3.6946, 1.10, 0.0522],   30: [6.6005, 1.51, 0.2318],   45: [9.3293, 1.81, 0.4918]}
  detail:         {5: [0.1049, 0.0994, 0.0011], 15: [0.3943, 0.2839, 0.0188], 30: [0.8948, 0.5446, 0.1124], 45: [1.6777, 0.8727, 0.3217]}
