# =============================================================================
# 발 → 몸 모델 평가 설정 (feat/feet-to-body)
# -----------------------------------------------------------------------------
# - 사용처: feet_to_body/eval_body.py (load_named_config("eval", "feet_to_body"))
# - 나머지는 configs/eval/lengths.yaml (ctx_base, det_cont, 평가셋, L2P 통계, 발 미끄러짐, batch_size) 와
#   configs/eval/foot_only.yaml (foot_ckpt) 을 그대로 쓴다 (기존 평가와 같은 조건).
# - 값의 출처: [결정] = 이 평가에서 정한 값 (docs/assumptions.md I 절)
# =============================================================================

body_ckpt: experiments/feet_to_body/best.pth    # [결정] val30_loss 최소 (I6)

# 평가셋별 transition 길이 [결정] (발 전용 평가와 같은 길이)
lengths:
  official: [5, 15, 30, 45]      # 학습 범위 5–30 + 공식 45
  long: [30, 60, 90]             # 60, 90 = 학습 범위 밖

# 비교 방법 [결정]
#   body_gt      : 발 → 몸, 정답 발 조건 (상한), 후처리 없음
#   body_gt_post : 같은 출력 + 후처리 (식 23)
#   body_pred    : 발 → 몸, 발 전용 모델 (foot_ckpt) 이 예측한 발 조건 (위치 + 접촉 확률), 후처리 없음
#                  (학습은 정답 발로만 했으므로 학습·추론 입력이 다름, I4)
#   body_pred_post : 같은 출력 + 후처리
#   ctx_post     : Context Transformer + 후처리 (기존 평가의 model)
#   ctx_nopost   : Context Transformer, 후처리 없음
#   two_stage    : ctx_base + det_cont (기존 평가의 detail)
#   interp       : SLERP 보간
methods: [body_gt, body_gt_post, body_pred, body_pred_post, ctx_post, ctx_nopost, two_stage, interp]

out_dir: outputs/eval/feet_to_body   # 프로젝트 루트 기준, git 제외

# 발 오차 민감도 실험 (feet_to_body/eval_foot_mix.py, I11) [결정]
#   발 조건 = (1 − α) × 정답 발 + α × 발 전용 모델이 예측한 발 (위치·접촉 모두). α = 0 정답, α = 1 예측 그대로
foot_mix:
  alphas: [0.0, 0.25, 0.5, 0.75, 1.0]
  set: official
  lengths: [5, 15, 30, 45]
  body_ckpts:                    # 비교할 발 → 몸 체크포인트 (이름: 경로)
    run1_gt_feet: experiments/feet_to_body/best.pth
    run2_pred_feet: experiments/feet_to_body_pred/best.pth
  out_dir: outputs/eval/feet_to_body_mix
